<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VocabTrainer — 背单词</title>
<style>
:root {
  --bg:#f5f5fb; --surface:#fff; --text:#1a1a2e; --text2:#6b7280;
  --border:#e5e7eb; --accent:#4f46e5; --accent-l:#eef2ff;
  --green:#10b981; --red:#ef4444; --orange:#f59e0b;
  --shadow:0 2px 16px rgba(0,0,0,.06); --shadow-lg:0 8px 32px rgba(0,0,0,.1);
  --radius:14px; --radius-sm:10px;
}
body.dark {
  --bg:#0f172a; --surface:#1e293b; --text:#e2e8f0; --text2:#94a3b8;
  --border:#334155; --accent-l:#1e1b4b;
  --shadow:0 2px 16px rgba(0,0,0,.3); --shadow-lg:0 8px 32px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; transition:background .3s,color .3s;
}
button{cursor:pointer; font-family:inherit;}

.app{max-width:780px;margin:0 auto;padding:16px;}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px;flex-wrap:wrap;}
.app-header h1{font-size:1.3rem;font-weight:700;white-space:nowrap;}
.header-right{display:flex;gap:8px;align-items:center;}
.theme-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--surface);font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.2s;}
.theme-btn:hover{border-color:var(--accent);}

.breadcrumb{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--text2);margin-bottom:16px;flex-wrap:wrap;}
.breadcrumb a{color:var(--accent);text-decoration:none;cursor:pointer;font-weight:500;}
.breadcrumb a:hover{text-decoration:underline;}
.breadcrumb span{opacity:.6;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:16px;}
.card h2{font-size:1.1rem;margin-bottom:12px;}

.btn{padding:9px 20px;border-radius:22px;border:none;font-size:.9rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-outline{background:var(--surface);color:var(--text);border:2px solid var(--border);}
.btn-outline:hover{border-color:var(--accent);background:var(--accent-l);}
.btn-sm{padding:6px 14px;font-size:.8rem;border-radius:18px;}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{opacity:.85;}

.deck-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;transition:.2s;box-shadow:var(--shadow);}
.deck-card:hover{border-color:var(--accent);}
.deck-info{flex:1;min-width:0;}
.deck-info h3{font-size:1rem;font-weight:600;margin-bottom:4px;}
.deck-meta{font-size:.8rem;color:var(--text2);display:flex;gap:12px;flex-wrap:wrap;}
.deck-actions{display:flex;gap:8px;}

.progress-pill{display:inline-flex;align-items:center;gap:4px;background:var(--accent-l);color:var(--accent);padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600;}

.import-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:32px 24px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:16px;background:var(--surface);}
.import-zone:hover,.import-zone.dragover{border-color:var(--accent);background:var(--accent-l);}
.import-zone p{color:var(--text2);font-size:.9rem;margin-top:8px;}
.import-zone .icon{font-size:2.5rem;}

.paste-area{display:none;margin-top:12px;}
.paste-area.show{display:block;}
.paste-area textarea{width:100%;height:120px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:.85rem;font-family:monospace;resize:vertical;background:var(--surface);color:var(--text);}

.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:32px 24px;text-align:center;max-width:480px;margin:0 auto;}
.big-word{font-size:2.6rem;font-weight:800;margin-bottom:8px;}
.phonetic{font-size:1.1rem;color:var(--text2);margin-bottom:24px;}
.review-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}

.progress-wrap{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--text2);}
.progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;}

.flashcard-wrap{perspective:1200px;cursor:pointer;max-width:480px;margin:0 auto;user-select:none;-webkit-tap-highlight-color:transparent;}
.flashcard{width:100%;aspect-ratio:1.35;position:relative;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.4,0,.2,1);}
.flashcard.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;backface-visibility:hidden;}
.fc-back{transform:rotateY(180deg);}
.fc-word{font-size:2.4rem;font-weight:800;margin-bottom:6px;}
.fc-phonetic{font-size:1rem;color:var(--text2);margin-bottom:6px;}
.fc-hint{font-size:.75rem;color:var(--text2);opacity:.5;margin-top:12px;}
.fc-zh{font-size:1.2rem;font-weight:600;margin-bottom:10px;text-align:center;line-height:1.5;}
.fc-en{font-size:.9rem;color:var(--text2);margin-bottom:10px;text-align:center;font-style:italic;}
.fc-example{font-size:.85rem;color:var(--accent);text-align:center;line-height:1.5;}

.fc-nav{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:16px;}
.fc-nav-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:1.1rem;color:var(--text);display:flex;align-items:center;justify-content:center;transition:.2s;}
.fc-nav-btn:hover{border-color:var(--accent);background:var(--accent-l);}
.fc-counter{font-size:.85rem;color:var(--text2);min-width:56px;text-align:center;}

.fc-actions{display:flex;gap:10px;justify-content:center;margin-top:12px;}

.quiz-wrap{max-width:500px;margin:0 auto;}
.quiz-q-word{font-size:2.2rem;font-weight:800;text-align:center;padding:12px;}
.quiz-q-phonetic{font-size:1rem;color:var(--text2);text-align:center;margin-bottom:16px;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;}
.quiz-opt{padding:12px 18px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--surface);font-size:.95rem;text-align:left;transition:.2s;}
.quiz-opt:hover{border-color:var(--accent);background:var(--accent-l);}
.quiz-opt.correct{border-color:var(--green)!important;background:#d1fae5!important;}
.quiz-opt.wrong{border-color:var(--red)!important;background:#fee2e2!important;}
.quiz-fb{text-align:center;font-size:1rem;font-weight:600;min-height:26px;margin-top:10px;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.88rem;}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);}
th{background:var(--accent-l);color:var(--accent);font-weight:600;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.word-col{font-weight:700;white-space:nowrap;}
.zh-col{line-height:1.4;}
.pe-in{width:100%;box-sizing:border-box;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:.85rem;}

.search-box{width:100%;padding:10px 14px;border-radius:20px;border:2px solid var(--border);background:var(--surface);font-size:.9rem;color:var(--text);outline:none;margin-bottom:12px;transition:.2s;}
.search-box:focus{border-color:var(--accent);}

.tabs{display:flex;gap:3px;background:var(--border);border-radius:22px;padding:3px;margin-bottom:16px;}
.tab{padding:7px 16px;border-radius:20px;border:none;background:transparent;font-size:.85rem;color:var(--text2);font-weight:500;transition:.2s;}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.tab:hover:not(.active){color:var(--text);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;max-width:500px;width:100%;box-shadow:var(--shadow-lg);}
.modal h3{margin-bottom:12px;}

.shortcuts{text-align:center;font-size:.78rem;color:var(--text2);padding:12px 0;opacity:.7;}
.shortcuts-toggle{font-size:.78rem;color:var(--accent);cursor:pointer;opacity:.5;transition:.2s;}
.shortcuts-toggle:hover{opacity:1;}
.touch-hint{text-align:center;font-size:.75rem;color:var(--text2);opacity:.6;margin-top:4px;}

.chart-wrap{display:flex;gap:4px;align-items:flex-end;height:100px;margin-top:12px;}
.chart-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:2px;}
.chart-bar{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;width:100%;transition:height .3s;}
.chart-label{font-size:.65rem;color:var(--text2);}

.day-goal-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:10px 14px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);}
.day-goal-bar .goal-pct{font-size:.85rem;font-weight:600;color:var(--accent);}

.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.85rem;transition:.2s;vertical-align:middle;margin-left:4px;}
.speak-btn:hover{border-color:var(--accent);background:var(--accent-l);}
.speak-btn.speaking{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.auto-speak-btn{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.78rem;color:var(--text2);transition:.2s;white-space:nowrap;}
.auto-speak-btn:hover{border-color:var(--accent);}
.auto-speak-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}

.spell-wrap{max-width:500px;margin:0 auto;text-align:center;}
.spell-zh{font-size:1.4rem;font-weight:600;margin-bottom:6px;line-height:1.5;}
.spell-en-hint{font-size:.9rem;color:var(--text2);margin-bottom:20px;font-style:italic;}
.spell-input-row{display:flex;gap:8px;justify-content:center;}
.spell-input{padding:12px 16px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--surface);color:var(--text);font-size:1.1rem;width:260px;outline:none;text-align:center;transition:.2s;}
.spell-input:focus{border-color:var(--accent);}
.spell-input.correct{border-color:var(--green)!important;background:#d1fae5!important;}
.spell-input.wrong{border-color:var(--red)!important;background:#fee2e2!important;}
.spell-fb{text-align:center;font-size:1rem;font-weight:600;min-height:26px;margin-top:12px;}

.dictate-zh-input{padding:10px 14px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--surface);color:var(--text);font-size:.95rem;width:260px;outline:none;text-align:center;transition:.2s;margin-top:10px;}
.dictate-zh-input:focus{border-color:var(--accent);}
.dictate-zh-input.correct{border-color:var(--green)!important;background:#d1fae5!important;}
.dictate-zh-input.wrong{border-color:var(--red)!important;background:#fee2e2!important;}

@media(max-width:500px){
  .big-word{font-size:2rem;}
  .fc-word{font-size:1.8rem;}
  .quiz-q-word{font-size:1.7rem;}
  .deck-card{flex-direction:column;align-items:stretch;}
  .deck-actions{justify-content:flex-end;}
  .btn{padding:8px 16px;font-size:.85rem;}
}
</style>
</head>

// ===================== STORAGE =====================
const LS_DECKS = 'vt_decks';
const LS_SETTINGS = 'vt_settings';
const LS_STATS = 'vt_stats';

function loadDecks(){ try{return JSON.parse(localStorage.getItem(LS_DECKS))||{};}catch(e){return{};} }
function saveDecks(d){localStorage.setItem(LS_DECKS,JSON.stringify(d));}
function loadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_SETTINGS))||{};
    if(s.theme===undefined && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
      s.theme = 'dark';
    }
    return s;
  }catch(e){return{};}
}
function saveSettings(s){localStorage.setItem(LS_SETTINGS,JSON.stringify(s));}
function loadStats(){ try{return JSON.parse(localStorage.getItem(LS_STATS))||{};}catch(e){return{};} }
function saveStats(s){localStorage.setItem(LS_STATS,JSON.stringify(s));}

function recordStudyAction(){
  const s = loadStats();
  const today = new Date().toISOString().slice(0,10);
  s[today] = (s[today]||0)+1;
  // Keep only last 90 days
  const keys = Object.keys(s).sort();
  while(keys.length>90){ delete s[keys.shift()]; }
  saveStats(s);
}
function recordSuccess(){
  recordStudyAction();
  const s = loadSettings();
  const today = new Date().toISOString().slice(0,10);
  s[today+'-correct'] = (s[today+'-correct']||0)+1;
  saveSettings(s);
  // Check goal
  const goal = s.goal||20;
  if(s[today+'-correct']>=goal && s[today+'-goal-done']!==true){
    s[today+'-goal-done'] = true;
    saveSettings(s);
    toast('🎉 每日目标达成！');
  }
}

function getWeekDays(){
  const s = loadStats();
  const now = new Date();
  let days=0;
  for(let i=0;i<7;i++){
    const d = new Date(now); d.setDate(d.getDate()-i);
    if(s[d.toISOString().slice(0,10)]) days++;
  }
  return days;
}

function getTodayCount(){
  return loadStats()[new Date().toISOString().slice(0,10)]||0;
}
function getAutoSpeak(){ return loadSettings().autoSpeak!==false; } // default ON
function toggleAutoSpeak(){ const s=loadSettings(); s.autoSpeak=!getAutoSpeak(); saveSettings(s); render(); }
function toggleTheme(){ const s=loadSettings(); s.theme=s.theme==='dark'?'light':'dark'; s.themeManuallySet=true; saveSettings(s); render(); }

function ensurePreset(){
  const decks = loadDecks();
  if(Object.keys(decks).length===0){
    const id = 'preset-list7';
    decks[id] = { id, title:'雅思词汇（完整版）(List 7)', createdAt:Date.now(), words: PRESET_WORDS.map(w=>({...w,status:'unknown'})) };
    saveDecks(decks);
  }
  // Ensure settings exist
  const settings = loadSettings();
  if(settings.goal===undefined) settings.goal=20;
  saveSettings(settings);
}

// ===================== SINGLE EVENT DELEGATION =====================
document.getElementById('app').addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const arg = btn.dataset.arg;
  const arg2 = btn.dataset.arg2;

  e.stopPropagation();

  switch(action){
    // Import preview editing
    case 'pe-add-row': previewData.words.push({word:'',phonetic:'',zh:'',en:'',example:'',status:'unknown'}); render(); break;
    case 'pe-del-row': previewData.words.splice(parseInt(arg),1); render(); break;
    case 'pe-restore': if(previewData.originalWords) previewData.words = JSON.parse(JSON.stringify(previewData.originalWords)); render(); break;
    // Global
    case 'go-decks': currentView='decks'; activeDeckId=null; updateHash(); render(); break;
    case 'toggle-theme': toggleTheme(); break;
    // Decks
    case 'start-review': startReview(arg); updateHash(); render(); break;
    case 'start-study': startStudy(arg); updateHash(); render(); break;
    case 'start-weak': startWeakStudy(arg); updateHash(); render(); break;
    case 'delete-deck': deleteDeck(arg); break;
    case 'show-paste': document.getElementById('pasteArea').classList.toggle('show'); break;
    case 'process-paste': processPaste(); break;
    // Import preview
    case 'cancel-import': previewData=null; currentView='decks'; render(); break;
    case 'confirm-import': confirmImport(); break;
    // Review
    case 'review-know': reviewAnswer(true); break;
    case 'review-dunno': reviewAnswer(false); break;
    case 'review-peek': reviewPeek(); return; // update DOM directly, no re-render
    case 'finish-review': finishReview(); break;
    // Study tabs
    case 'study-flashcard': studyMode='flashcard'; render(); break;
    case 'study-zh2en': studyMode='zh2en'; render(); break;
    case 'study-quiz': studyMode='quiz'; initQuiz(); render(); break;
    case 'study-list': studyMode='list'; render(); break;
    // Flashcard
    case 'fc-flip': flipFC(); break;
    case 'fc-prev': studyIndex=(studyIndex-1+studyWords.length)%studyWords.length; cardFlipped=false; render(); break;
    case 'fc-next': studyIndex=(studyIndex+1)%studyWords.length; cardFlipped=false; render(); break;
    case 'fc-known': markStudyWord(true); recordSuccess(); break;
    case 'fc-reset-all': resetAllStudy(); break;
    // Quiz
    case 'quiz-answer': quizAnswer(parseInt(arg)); return; // quizAnswer updates DOM directly
    case 'quiz-next': nextQuiz(); return; // nextQuiz calls render() internally via setTimeout
    case 'quiz-retry': initQuiz(); render(); break;
    case 'quiz-back-card': studyMode='flashcard'; render(); break;
    // Quiz size
    case 'set-quiz-size': quizSize = parseInt(arg); if(studyMode==='quiz'){ initQuiz(); } break;
    // Study list
    case 'sl-known': markStudyListWord(parseInt(arg)); recordSuccess(); break;
    // Weak filter toggle
    case 'toggle-weak-filter': studyWeakOnly = !studyWeakOnly; break;
    // Shortcuts toggle
    case 'toggle-shortcuts': document.getElementById(arg).style.display='none'; return;
    // Review done
    case 'review-done-back': currentView='decks'; updateHash(); render(); break;
    case 'review-done-study': startStudy(activeDeckId); updateHash(); render(); break;
    // Audio
    case 'speak': e.stopPropagation(); speakWord(arg); return; // don't re-render
    case 'toggle-auto-speak': toggleAutoSpeak(); return;
    // Export/Import
    case 'export-decks': exportDecks(); return;
    case 'import-decks': document.getElementById('jsonFileInput').click(); return;
    // Quiz wrong review
    case 'quiz-review-wrong':
      quizWords=[...quizWrong]; quizWrong=[]; quizIdx=0; quizCorrect=0; quizAnswered=false; isWrongReview=true; break;
    case 'save-goal':
      const goal = parseInt(document.getElementById('goalInput')?.value)||20;
      const gs = loadSettings(); gs.goal=goal; saveSettings(gs);
      toast('目标设为 '+goal+' 词/天'); return;
    // Spelling
    case 'study-spell': studyMode='spell'; initSpell(); break;
    case 'spell-check': checkSpelling(); return;
    case 'spell-next': nextSpell(); break;
    case 'spell-replay': e.stopPropagation(); speakWord(spellWords[spellIndex].word); return;
    case 'spell-submode-en': spellSubMode='en'; break;
    case 'spell-submode-enzh': spellSubMode='enzh'; break;
    case 'spell-zh-check': checkSpellZh(); return;
  }
  render();
});

// ===================== HELPERS =====================
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function extractPOS(zh){
  const prefixes = ['n.','v.','adj.','adv.','vt.','vi.','prep.','conj.','pron.','num.','art.','int.'];
  for(const p of prefixes){
    if(zh.startsWith(p)) return p;
  }
  return '';
}

// Format active word display with level dots
function levelDots(level){
  level = level||0;
  const stages = ['⚪','🟡','🟠','🟢'];
  return stages.slice(0,level).join('')+stages.slice(level,4).join('').replace(/[🟡🟠🟢⚪]/g,'·');
}

  renderBusy = true;
  const settings = loadSettings();

  let html = '';
  // Header
  html += '<div class="app-header">';
  html += '<h1>📚 VocabTrainer</h1>';

  html += '<button class="btn btn-outline btn-sm" data-action="toggle-theme" style="gap:4px">'+(isDark?'☀️ 日间':'🌙 夜间')+'</button>';
  html += '</div></div>';

  // Breadcrumb
  html += '<div class="breadcrumb"><a data-action="go-decks">词库列表</a>';

    const d = getDeck();
    if(currentView==='review') html += ' <span>›</span> <a data-action="go-decks">'+esc(d.title)+'</a> <span>› 筛查</span>';
    else if(currentView==='study') html += ' <span>›</span> <a data-action="go-decks">'+esc(d.title)+'</a> <span>› 背生词</span>';
    else if(currentView==='import-preview') html += ' <span>›</span> <span>导入预览</span>';
  }
  html += '</div>';

  // Main
  switch(currentView){
    case 'decks': html += renderDecksHTML(); break;
    case 'review': html += renderReviewHTML(); break;
    case 'study': html += renderStudyHTML(); break;
    case 'import-preview': html += renderImportPreviewHTML(); break;
  }

  document.getElementById('app').innerHTML = html;

  // Post-render setup
  if(currentView==='decks') setupImportZone();
  if(currentView==='study' && studyMode==='list') setupSearchInput();
  if(currentView==='study' && studyMode==='spell'){
    setTimeout(()=>{
      const id = spellSubMode==='enzh'?'spellInputEn2':'spellInputEn';
      const inp = document.getElementById(id); if(inp) inp.focus();
    }, 100);
  }

  // Auto-speak (immediate, no delay)
  if(getAutoSpeak()){
    if(currentView==='study' && studyMode==='flashcard' && studyWords.length>0) speakWord(studyWords[studyIndex].word);
    if(currentView==='study' && studyMode==='quiz' && quizCur) speakWord(quizCur.word);
    if(currentView==='review' && reviewIndex<reviewWords.length) speakWord(reviewWords[reviewIndex].word);
  }
  setTimeout(()=>{ renderBusy = false; }, 50);
}

// ===================== IMPORT =====================
function setPreview(title, words){
  previewData = {title, words, originalWords: JSON.parse(JSON.stringify(words))};
}

function processPaste(){
  const raw = document.getElementById('pasteTextarea').value.trim();
  if(!raw){ alert('请先粘贴内容'); return; }
  // Try CSV first, then HTML
  if(!raw.toLowerCase().startsWith('<') && raw.includes(',')){
    parseCSV(raw);
  } else if(isPlainText(raw)){
    parsePlainText(raw);
  } else {
    parseAndPreview(raw);
  }
}

function isPlainText(str){
  return !str.trim().startsWith('<') && !str.includes(',');
}

function parseCSV(input){
  const lines = input.split('\n').filter(l=>l.trim());
  const words = [];
  for(const line of lines){
    const parts = line.split(',');
    if(parts.length<2) continue;
    words.push({word:parts[0].trim(),phonetic:'',zh:parts[1].trim(),en:'',example:'',status:'unknown'});
  }
  if(words.length===0){ alert('未能解析 CSV 内容'); return; }
  setPreview('CSV 导入词库', words);
  currentView = 'import-preview';
  render();
}

function parsePlainText(input){
  const lines = input.split('\n').filter(l=>l.trim());
  const words = [];
  for(const line of lines){
    let word, zh;
    // 优先按制表符切分
    let sep = line.indexOf('\t');
    if(sep>=0){
      word = line.slice(0,sep).trim(); zh = line.slice(sep+1).trim();
    } else {
      // 英文短语在前、中文在最后，且英文可能含空格。
      // 以第一个中文字符为边界切分，兼容“英文...中文”无空格的情况。
      const m = line.search(/[一-鿿　-〿＀-￯]/);
      if(m>=0){
        word = line.slice(0,m).trim(); zh = line.slice(m).trim();
      } else {
        // 没有中文则退回按最后一个空格切分
        sep = line.lastIndexOf(' ');
        if(sep<0) continue;
        word = line.slice(0,sep).trim(); zh = line.slice(sep+1).trim();
      }
    }
    if(word && zh) words.push({word,phonetic:'',zh,en:'',example:'',status:'unknown'});
  }
  if(words.length===0){ alert('未能解析纯文本内容'); return; }
  setPreview('文本导入词库', words);
  currentView = 'import-preview';
  render();
}

function processFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    const txt = reader.result;
    if(file.name.endsWith('.csv')){ parseCSV(txt); }
    else if(file.name.endsWith('.txt')||file.name.endsWith('.text')){ parsePlainText(txt); }
    else { parseAndPreview(txt); }
  };
  reader.readAsText(file);
}

function parseAndPreview(htmlString){
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlString,'text/html');
  const title = doc.querySelector('.practice-vocabulary__title')?.textContent?.trim()||'未命名词库';
  const words = [];
  const wordEls = doc.querySelectorAll('.practice-vocabulary__word');
  wordEls.forEach(el=>{
    const item = el.closest('.practice-vocabulary__item');
    if(!item) return;
    // Get only the UK phonetic (first .practice-vocabulary__phonetic-text in this item)
    const phoneticEl = item.querySelector('.practice-vocabulary__phonetic-text');
    words.push({
      word: el.textContent.trim(), phonetic: phoneticEl?phoneticEl.textContent.trim():'',
      zh: item.querySelector('.practice-vocabulary__meaning-zh')?.textContent?.trim()||'',
      en: item.querySelector('.practice-vocabulary__meaning-en')?.textContent?.trim()||'',
      example: item.querySelector('.practice-vocabulary__meaning-example')?.textContent?.trim()||'',
      status:'unknown'
    });
  });

  if(words.length===0){
    // Also try parsing plain CSV/TSV/TXT (word,meaning format)
    const csvMatch = htmlString.match(/([\w\-']+)\s*[,\t;]\s*(.+?)(?:\n|$)/g);
    if(csvMatch){
      const csvWords = csvMatch.map(line=>{
        const parts = line.split(/[,;\t]/);
        return {
          word: parts[0].trim(),
          phonetic:'', zh: parts[1]?parts[1].trim():'',
          en:'', example:'', status:'unknown'
        };
      });
      if(csvWords.length>0){
        setPreview('粘贴导入', csvWords);
        currentView='import-preview';
        render();
        return;
      }
    }
    alert('未能从该文件中识别出单词。请确认文件格式与「基础练习.html」一致，或粘贴 CSV 格式（单词,中文）。');
    return;
  }
  setPreview(title, words);
  currentView = 'import-preview';
  render();
}

  const sorted = [...studyWords].sort((a,b)=>{

    if(wa>0&&wb===0) return -1; if(wb>0&&wa===0) return 1;
    return Math.random()-.5;

  quizWords = sorted.slice(0, quizSize===-1 ? sorted.length : Math.min(quizSize, sorted.length));
  quizIdx = 0; quizCorrect = 0; quizAnswered = false; quizCur = null; quizOpts = []; quizWrong = []; isWrongReview = false;

    h += '<div style="font-size:3rem">'+emoji+'</div><h2>测验完成！</h2>';
    h += '<p>正确 '+quizCorrect+' / '+quizWords.length+' （'+pct+'%）</p>';
    if(quizWrong.length>0) h += '<p style="color:var(--red);margin-bottom:8px">❌ 错题: '+quizWrong.length+' 道</p>';
    h += '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">';
    h += '<button class="btn btn-primary" data-action="quiz-back-card">回到卡片</button>';
    h += '<button class="btn btn-outline" data-action="quiz-retry">🔄 再来一轮</button>';
    if(quizWrong.length>0) h += '<button class="btn btn-outline" data-action="quiz-review-wrong" style="border-color:var(--red);color:var(--red)">🔁 复习错题 ('+quizWrong.length+')</button>';
    h += '</div></div>';
    return h;
  }
  // Preserve answered state - don't allow re-randomization by re-render
  const wasAnswered = quizAnswered;
  if(!wasAnswered){
    quizCur = quizWords[quizIdx];
    const deckAll = getDeck().words.filter(w=>w.word!==quizCur.word);
    const correctPOS = extractPOS(quizCur.zh);
    // Smart distractors: prefer same POS, then random
    const samePOS = deckAll.filter(w=>extractPOS(w.zh)===correctPOS&&correctPOS!=='');
    const others = deckAll.filter(w=>extractPOS(w.zh)!==correctPOS||correctPOS==='');
    const candidates = [...samePOS.sort(()=>Math.random()-.5), ...others.sort(()=>Math.random()-.5)];
    const distractors = candidates.slice(0,3).map(w=>w.zh);
    quizOpts = [...distractors, quizCur.zh].sort(()=>Math.random()-.5);
  }

  let h = '<div class="quiz-wrap">';
  h += '<div style="text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:8px">第 '+(quizIdx+1)+' 题 / 共 '+quizWords.length+' 题 | 正确 '+quizCorrect+(quizIdx>0?' ('+Math.round(quizCorrect/quizIdx*100)+'%)':' (第1题)')+'</div>';
  h += '<div class="quiz-q-word">'+esc(quizCur.word)+' <button class="speak-btn" data-action="speak" data-arg="'+esc(quizCur.word)+'" title="朗读">🔊</button></div>';
  h += '<div class="quiz-q-phonetic">'+esc(quizCur.phonetic||'')+'</div>';
  h += '<div class="quiz-opts">';
  quizOpts.forEach((opt,i)=>{
    h += '<button class="quiz-opt" data-action="quiz-answer" data-arg="'+i+'">'+(String.fromCharCode(65+i))+'. '+esc(opt)+'</button>';
  });
  h += '</div>';
  h += '<div class="quiz-fb" id="quizFeedback"></div>';
  h += '<button class="btn btn-primary" id="quizNext" data-action="quiz-next" style="display:none;margin:12px auto 0">下一题 ▶</button>';
  h += '</div>';
  return h;
}

function quizAnswer(idx){
  if(quizAnswered) return;
  quizAnswered = true;
  const correctZh = quizCur.zh;
  const isCorrect = quizOpts[idx] === correctZh;
  if(isCorrect){ quizCorrect++; quizCur.status='known'; quizCur.level = Math.min(3,(quizCur.level||0)+1); recordSuccess(); }
  else { quizWrong.push(quizCur); quizCur.wrongCount=(quizCur.wrongCount||0)+1; quizCur.level = Math.max(0,(quizCur.level||0)-1); }
  save();

  // Update DOM directly for feedback (avoids re-render)
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach((opt,i)=>{
    opt.style.pointerEvents = 'none';
    if(quizOpts[i]===correctZh) opt.classList.add('correct');
    else if(i===idx && !isCorrect) opt.classList.add('wrong');
  });
  const fb = document.getElementById('quizFeedback');
  fb.textContent = isCorrect?'✅ 正确！':'❌ 错误！正确答案是: '+correctZh;
  fb.style.color = isCorrect?'var(--green)':'var(--red)';
  document.getElementById('quizNext').style.display = '';
  // Auto-speak correct word on wrong answer
  if(!isCorrect) setTimeout(()=>speakWord(quizCur.word), 400);
}

function nextQuiz(){ quizIdx++; quizAnswered = false; quizOpts = []; render(); }

// ===== SPELLING =====
function initSpell(){
  spellWords = [...studyWords].sort(()=>Math.random()-.5).slice(0, Math.min(20, studyWords.length));
  spellIndex = 0; spellCorrect = 0; spellResult = null;
}

function renderSpellHTML(){
  if(spellWords.length===0) initSpell();
  if(spellIndex >= spellWords.length){
    const pct = spellWords.length>0?Math.round(spellCorrect/spellWords.length*100):0;
    let emoji = pct>=90?'🎉':pct>=70?'👍':pct>=50?'📖':'💪';
    refreshStudyWords();
    let h = '<div class="card" style="text-align:center">';
    h += '<div style="font-size:3rem">'+emoji+'</div><h2>'+((spellSubMode==='enzh')?'听写':'拼写')+'完成！</h2>';
    h += '<p>正确 '+spellCorrect+' / '+spellWords.length+' （'+pct+'%）</p>';
    h += '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">';
    h += '<button class="btn btn-primary" data-action="quiz-back-card">回到卡片</button>';
    h += '<button class="btn btn-outline" data-action="study-spell">🔄 再来一轮</button>';
    h += '</div></div>';
    return h;
  }
  const w = spellWords[spellIndex];
  spellResult = null;
  let h = '<div class="spell-wrap">';
  h += '<div style="text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:12px">';

  h += ' &nbsp;<button class="speak-btn" data-action="spell-replay" title="再读一遍">🔊</button>';

  h += '<button class="tab'+(spellSubMode==='enzh'?' active':'')+'" data-action="spell-submode-enzh">📝 英文+中文</button>';

    // Original: show zh meaning, type English

    if(w.en) h += '<div class="spell-en-hint">'+esc(w.en)+'</div>';
    h += '<div class="spell-input-row">';
    h += '<input class="spell-input" id="spellInputEn" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入英文单词...">';
    h += '<button type="button" class="btn btn-primary" data-action="spell-check">检查</button>';

    h += '<div class="spell-fb" id="spellFeedbackEn"></div>';
    h += '<button class="btn btn-primary" id="spellNextEn" data-action="spell-next" style="display:none;margin:12px auto 0">下一题 ▶</button>';

    // Dictation: hear audio, type English + Chinese (no hints shown)
    h += '<div style="text-align:center;font-size:1.1rem;color:var(--text2);margin-bottom:16px">🔊 听发音，输入英文和中文</div>';

function checkSpellZh(){
  const inpEn = document.getElementById('spellInputEn2');
  const inpZh = document.getElementById('spellInputZh2');
  if(!inpEn || !inpZh || spellResult!==null) return;
  const answerEn = inpEn.value.trim();
  const answerZh = inpZh.value.trim();
  const correctEn = spellWords[spellIndex].word;
  const correctZh = spellWords[spellIndex].zh;
  const enOk = answerEn.toLowerCase().replace(/\s+/g,'') === correctEn.toLowerCase().replace(/\s+/g,'');
  // For zh: do a simple substring match (loose, user might type subset of meanings)
  const zhOk = answerZh.length>0 && (correctZh.includes(answerZh) || answerZh.includes(correctZh.split('；')[0]));
  const isCorrect = enOk && zhOk;
  spellResult = isCorrect;
  if(isCorrect){ spellCorrect++; spellWords[spellIndex].status='known'; spellWords[spellIndex].level=Math.min(3,(spellWords[spellIndex].level||0)+1); save(); recordSuccess(); }
  else { spellWords[spellIndex].wrongCount=(spellWords[spellIndex].wrongCount||0)+1; spellWords[spellIndex].level=Math.max(0,(spellWords[spellIndex].level||0)-1); recordStudyAction(); }
  inpEn.value=''; inpZh.value='';
  inpEn.classList.add(enOk?'correct':'wrong'); inpEn.disabled=true;
  inpZh.classList.add(zhOk?'correct':'wrong'); inpZh.disabled=true;
  const fb=document.getElementById('spellFeedbackEn2');
  if(isCorrect){
    fb.textContent='✅ 全对！'; fb.style.color='var(--green)';
  } else {
    let msg='❌ ';
    if(!enOk) msg+='英文错误，正解: <b>'+esc(correctEn)+'</b> ';
    if(!zhOk) msg+='中文错误，正解: <b>'+esc(correctZh)+'</b> ';
    fb.innerHTML=msg; fb.style.color='var(--red)';
  }
  document.getElementById('spellNextEn2').style.display='';
}

function checkSpelling(){
  const inp = document.getElementById('spellInputEn');
  if(!inp || spellResult!==null) return;
  const answer = inp.value.trim();
  const correct = spellWords[spellIndex].word;
  // Normalize: case insensitive
  const isCorrect = answer.toLowerCase() === correct.toLowerCase();
  spellResult = isCorrect;
  if(isCorrect){ spellCorrect++; spellWords[spellIndex].status='known'; spellWords[spellIndex].level = Math.min(3,(spellWords[spellIndex].level||0)+1); save(); recordSuccess(); }
  else {
    spellWords[spellIndex].wrongCount=(spellWords[spellIndex].wrongCount||0)+1; spellWords[spellIndex].level = Math.max(0,(spellWords[spellIndex].level||0)-1); recordStudyAction();
    setTimeout(()=>speakWord(spellWords[spellIndex].word), 400);
  }

  inp.value='';
  inp.classList.add(isCorrect?'correct':'wrong');
  inp.disabled = true;
  const fb = document.getElementById('spellFeedbackEn');
  if(isCorrect){
    fb.textContent = '✅ 正确！';
    fb.style.color = 'var(--green)';
  } else {
    const diff = diffChars(answer.toLowerCase(), correct.toLowerCase());
    fb.innerHTML = '❌ 错误！正确答案: <b>'+esc(correct)+'</b><br><span style="font-size:.9rem;opacity:.7">你的答案: '+diff+'</span>';
    fb.style.color = 'var(--red)';
  }
  document.getElementById('spellNextEn').style.display = '';
}

function diffChars(input, correct){
  let result = '';
  const maxLen = Math.max(input.length, correct.length);
  for(let i=0;i<maxLen;i++){
    if(input[i]===correct[i]) result += '<span style="color:var(--green)">'+(input[i]?esc(input[i]):'')+'</span>';
    else {
      result += '<span style="color:var(--red);text-decoration:underline">'+(input[i]?esc(input[i]):'_')+'</span>';
    }
  }
  if(input.length<correct.length){
    result += '<span style="color:var(--red);text-decoration:underline">'+esc(correct.slice(input.length))+'</span>';
  }
  return result||'_';
}

function nextSpell(){
  spellIndex++;
  spellResult = null;
  render();
}

document.addEventListener('keydown', function(e){
  if(currentView==='review'){
    if(e.key==='1'){ e.preventDefault(); reviewAnswer(true); render(); }
    else if(e.key==='2'){ e.preventDefault(); reviewAnswer(false); render(); }
    else if(e.key==='3'){ e.preventDefault(); reviewPeek(); }
    else if(e.key==='ArrowLeft' && reviewIndex>0){ e.preventDefault(); reviewIndex--; render(); }
  }
  if(currentView==='study' && (studyMode==='flashcard'||studyMode==='zh2en') && studyWords.length>0){
    if(e.key===' ' || e.code==='Space'){ e.preventDefault(); flipFC(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); studyIndex=(studyIndex-1+studyWords.length)%studyWords.length; cardFlipped=false; render(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); studyIndex=(studyIndex+1)%studyWords.length; cardFlipped=false; render(); }
    else if(e.key==='1'){ e.preventDefault(); markStudyWord(true); render(); }
  }
  if(currentView==='study' && studyMode==='quiz' && !quizAnswered && quizCur){
    const map = {'1':0,'2':1,'3':2,'4':3};
    if(e.key in map){ e.preventDefault(); quizAnswer(map[e.key]); }
  }
  if(currentView==='study' && studyMode==='quiz' && quizAnswered && e.key==='Enter'){ e.preventDefault(); nextQuiz(); }
  if(currentView==='study' && studyMode==='spell'){
    if(spellSubMode==='en'){
      if(spellResult===null && e.key==='Enter'){ e.preventDefault(); checkSpelling(); }
      else if(spellResult!==null && e.key==='Enter'){ e.preventDefault(); nextSpell(); }
    } else if(spellSubMode==='enzh'){
      if(spellResult===null && e.key==='Enter'){ e.preventDefault(); checkSpellZh(); }
      else if(spellResult!==null && e.key==='Enter'){ e.preventDefault(); nextSpell(); }
    }
  }
});

// ===================== AUDIO =====================
let cachedVoices = [];
let isSpeaking = false;

function loadVoices(){
  cachedVoices = speechSynthesis.getVoices();
  if(cachedVoices.length===0){
    speechSynthesis.addEventListener('voiceschanged', ()=>{
      cachedVoices = speechSynthesis.getVoices();
    }, {once:true});
  }
}

// Warm up the speech engine — prevents first-speak lag
function warmUpSpeech(){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0; u.rate = 2;
  speechSynthesis.speak(u);
}

function speakWord(word){
  if(!('speechSynthesis' in window)) return;
  // Don't cancel if already idle — cancel() itself causes Chrome to pause for ~200ms
  if(isSpeaking) window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.85;
  const enVoice = cachedVoices.find(v=>v.lang.startsWith('en-US')) || cachedVoices.find(v=>v.lang.startsWith('en'));
  if(enVoice) u.voice = enVoice;

  const btns = document.querySelectorAll('.speak-btn');
  btns.forEach(b=>b.classList.remove('speaking'));
  const activeBtn = document.querySelector('[data-arg="'+CSS.escape(word)+'"]');
  if(activeBtn) activeBtn.classList.add('speaking');

  isSpeaking = true;
  u.onend = ()=>{ isSpeaking=false; btns.forEach(b=>b.classList.remove('speaking')); };
  u.onerror = ()=>{ isSpeaking=false; btns.forEach(b=>b.classList.remove('speaking')); };
  speechSynthesis.speak(u);
}

// ===================== EXPORT / IMPORT =====================
function exportDecks(){
  const data = { version:1, exportedAt:new Date().toISOString(), decks:loadDecks() };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vocab-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

// JSON file input
const jsonInput = document.createElement('input');
jsonInput.type = 'file'; jsonInput.accept = '.json'; jsonInput.id = 'jsonFileInput'; jsonInput.style.display = 'none';
document.body.appendChild(jsonInput);
jsonInput.addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(!data.decks){ alert('无效的备份文件。'); return; }
      const current = loadDecks();
      let imported = 0, merged = 0;
      for(const [id, deck] of Object.entries(data.decks)){
        if(current[id]){
          // Merge: update known statuses
          const existing = current[id];
          for(const w of deck.words){
            const exw = existing.words.find(ew=>ew.word===w.word);
            if(exw && w.status==='known' && exw.status==='unknown') exw.status='known';
          }
          merged++;
        } else {
          current[id] = deck;
          imported++;
        }
      }
      saveDecks(current);
      alert('导入完成！新增 '+imported+' 个词库，合并 '+merged+' 个。');
      render();
    }catch(e){ alert('文件解析失败。'); }
  };
  reader.readAsText(f);
  this.value = '';
});

// Follow system theme changes (only if user hasn't manually set preference)
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
    const s = loadSettings();
    if(!s.themeManuallySet){
      s.theme = e.matches?'dark':'light';
      saveSettings(s);
      render();
    }
  });
}

// ===================== TOAST =====================
function toast(msg, duration=2000){
  let t = document.getElementById('vtToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'vtToast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:24px;font-size:.85rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.15);';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(()=>{ t.style.opacity = '1'; });
  setTimeout(()=>{ t.style.opacity = '0'; }, duration);
}

// ===================== STATS =====================
function getStreak(){
  const s = loadStats(); const now = new Date();
  let streak=0;
  for(let i=0;i<365;i++){
    const d = new Date(now); d.setDate(d.getDate()-i);
    if(s[d.toISOString().slice(0,10)]) streak++;
    else if(i>0) break;
  }
  return streak;
}
function getDayChart(days=7){
  const s = loadStats();
  const now = new Date();
  const result=[];
  for(let i=days-1;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const val = s[key]||0;
    const label = (d.getMonth()+1)+'/'+d.getDate();
    result.push({key, val, label});
  }
  return result;
}
const MAX_BAR_VAL = 50;

// ===================== TOUCH SWIPE =====================
let touchStartX=0, touchStartY=0;
document.addEventListener('touchstart', function(e){
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, {passive:true});
document.addEventListener('touchend', function(e){
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if(Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)*2) return;
  if(currentView==='study' && (studyMode==='flashcard'||studyMode==='zh2en') && studyWords.length>0){
    if(dx>0){ studyIndex=(studyIndex-1+studyWords.length)%studyWords.length; cardFlipped=false; render(); }
    else { studyIndex=(studyIndex+1)%studyWords.length; cardFlipped=false; render(); }
  }
  if(currentView==='review'){
    if(dx<0 && reviewIndex>0){ reviewIndex--; render(); }
  }
}, {passive:true});

// ===================== INIT =====================
function updateHash(){
  if(!activeDeckId){ window.location.hash = ''; return; }
  window.location.hash = currentView+'-'+activeDeckId;
}

function loadFromHash(){
  const h = window.location.hash.slice(1);
  if(!h) return;
  const dash = h.indexOf('-');
  if(dash<0) return;
  const view = h.slice(0,dash);
  const deckId = h.slice(dash+1);
  const validViews = ['review','study'];
  if(!validViews.includes(view)) return;
  decks = loadDecks();
  if(!decks[deckId]) return;
  activeDeckId = deckId;
  if(view==='review'){ startReview(deckId); }
  else if(view==='study'){ startStudy(deckId); }
}

if('speechSynthesis' in window){ loadVoices(); warmUpSpeech(); }
ensurePreset();
loadFromHash();
render();

window.addEventListener('hashchange', function(){
  loadFromHash();
  if(!activeDeckId){ currentView='decks'; render(); }
});
